name: Production Branch CI/CD

on:
  push:
    branches: [prod]

jobs:
  test-and-validate:
    name: Production Tests and Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting (strict)
        run: pnpm lint

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: pnpm test
        env:
          NODE_ENV: production

      - name: Verify coverage thresholds
        run: |
          echo "Checking coverage thresholds..."
          # Jest will fail if coverage is below thresholds set in jest.config.js

      - name: Build TypeScript
        run: pnpm build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.js" ]; then
            echo "Build failed: dist/index.js not found"
            exit 1
          fi
          echo "Build verification passed"

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: production-coverage
          path: coverage/
          retention-days: 30

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for vulnerabilities
        run: |
          echo "Security audit completed"
          # Add additional security checks if needed

  build-validation:
    name: Additional Production Validations
    runs-on: ubuntu-latest
    needs: [test-and-validate]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for production
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Test production build
        run: |
          echo "Testing production build..."
          node dist/index.js &
          PID=$!
          sleep 5

          # Check if process is still running
          if kill -0 $PID 2>/dev/null; then
            echo "Service started successfully"
            kill $PID
          else
            echo "Service failed to start"
            exit 1
          fi
